{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-md rounded-xl bg-white p-6 shadow-sm">
  <h1 class="mb-4 text-xl font-bold text-svf-dark">{% block heading %}{% endblock %}</h1>
  {% block intro %}{% endblock %}
  {% block body %}
  <form method="post" class="form-svf">{% csrf_token %}
    {% include "includes/_form.html" %}
    <button class="w-full rounded-lg bg-svf px-4 py-3 font-medium text-white hover:bg-svf-dark">{% block button %}Speichern{% endblock %}</button>
  </form>
  {% endblock %}
  {% block after %}{% endblock %}
</div>
{% endblock %}
