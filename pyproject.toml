[project]
name = "trainingserfassung"
version = "0.1.0"
description = "Recording of leader attendances per squad"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django (>=6.0,<7.0)",
    "psycopg[binary] (>=3.2)",
    "dj-database-url (>=2.3)",
    "gunicorn (>=23.0)",
    "whitenoise (>=6.8)",
    "openpyxl (>=3.1)",
    "argon2-cffi (>=23.1)",
    "django-axes (>=7.0)",
    "django-ratelimit (>=4.1)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ruff = ">=0.8"
mypy = ">=2.4"
django-stubs = {extras = ["compatible-mypy"], version = ">=6.1"}

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["/migrations/"]

[[tool.mypy.overrides]]
module = ["axes.*", "django_ratelimit.*", "dj_database_url.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"
