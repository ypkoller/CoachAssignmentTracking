name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Django tests (Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Same image and Postgres as locally: constraints, triggers and the Tailwind build are covered.
      - name: Build
        run: docker compose build web
      - name: Missing migrations
        run: docker compose run --rm web python manage.py makemigrations --check --dry-run
      - name: Tests
        run: docker compose run --rm web python manage.py test
      - name: Stop
        if: always()
        run: docker compose down -v

  lint:
    name: Lint and types (ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install (dev dependencies from poetry.lock)
        run: |
          pip install "poetry==2.5.1"
          poetry install --no-interaction
      - name: ruff
        run: poetry run ruff check .
      - name: mypy
        env:
          DJANGO_SECRET_KEY: mypy
        run: poetry run mypy .

  # Deploys master to Coolify only when tests and lint are green (Coolify's own Auto Deploy is off).
  # The secrets live in the GitHub environment "production"; pull requests never reach this job.
  deploy:
    name: Deploy (Coolify)
    needs: [tests, lint]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Trigger deployment
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          for name in COOLIFY_URL COOLIFY_TOKEN COOLIFY_APP_UUID; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is missing in environment production"; exit 1; fi
          done
          curl --fail-with-body --silent --show-error --max-time 60 \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            --get --data-urlencode "uuid=$COOLIFY_APP_UUID" \
            "${COOLIFY_URL%/}/api/v1/deploy"
