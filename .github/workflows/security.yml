name: Security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"  # weekly, also catches new CVEs without code changes
  workflow_dispatch:

permissions:
  contents: read

env:
  TRIVY_IMAGE: aquasec/trivy:0.76.1

jobs:
  code:
    name: Code (ruff security rules, Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: ruff (flake8-bandit)
        run: |
          pip install ruff==0.17.1
          ruff check --select S .
      - name: Semgrep
        run: >
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.181.0
          semgrep scan --error --metrics=off
          --config p/django --config p/python --config p/secrets --config p/dockerfile

  dependencies:
    name: Dependencies (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: pip-audit
        run: |
          pip install "poetry==2.5.1" "poetry-plugin-export==1.10.1" "pip-audit==2.10.1"
          poetry export --only main -f requirements.txt -o requirements.txt
          pip-audit -r requirements.txt --require-hashes --disable-pip --desc

  image:
    name: Docker image (Trivy, Django deploy check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t app:ci .
      - name: Trivy image (HIGH/CRITICAL with a fix)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock $TRIVY_IMAGE
          image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed app:ci
      - name: Trivy Dockerfile and secrets
        run: >
          docker run --rm -v "$PWD:/src" $TRIVY_IMAGE
          fs --exit-code 1 --scanners misconfig,secret /src
      - name: Django check --deploy
        run: >
          docker run --rm --entrypoint "" -e DJANGO_SECURE_COOKIES=true
          -e DJANGO_HSTS_SECONDS=31536000 -e DJANGO_SECRET_KEY="$(openssl rand -base64 48)"
          app:ci python manage.py check --deploy --fail-level WARNING
